<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">IoT-based Air Quality Index Meter System Architecture</text>
  
  <!-- Data Collection Layer (Hardware) -->
  <rect x="50" y="100" width="900" height="150" rx="10" ry="10" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="500" y="125" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Data Collection Layer (Hardware)</text>
  
  <!-- Sensor Node -->
  <rect x="100" y="150" width="200" height="80" rx="5" ry="5" fill="#ffffff" stroke="#198754" stroke-width="2"/>
  <text x="200" y="175" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Sensor Node</text>
  <text x="200" y="195" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">ESP32/ESP8266/Arduino</text>
  <text x="200" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">MQ-135, MQ-5, PM2.5, PM10</text>
  
  <!-- Power Management -->
  <rect x="350" y="150" width="200" height="80" rx="5" ry="5" fill="#ffffff" stroke="#198754" stroke-width="2"/>
  <text x="450" y="175" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Power Management</text>
  <text x="450" y="195" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Battery Pack</text>
  <text x="450" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Power Adapter, Charger Setup</text>
  
  <!-- Hardware Enclosure -->
  <rect x="600" y="150" width="200" height="80" rx="5" ry="5" fill="#ffffff" stroke="#198754" stroke-width="2"/>
  <text x="700" y="175" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Hardware Enclosure</text>
  <text x="700" y="195" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Weatherproof Housing</text>
  <text x="700" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Breadboard, Connecting Wires</text>
  
  <!-- Connectivity Layer -->
  <rect x="50" y="280" width="900" height="120" rx="10" ry="10" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="500" y="305" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Connectivity Layer</text>
  
  <!-- Communication Protocols -->
  <rect x="150" y="330" width="200" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
  <text x="250" y="355" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Communication Protocols</text>
  <text x="250" y="375" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">MQTT, HTTP/HTTPS, WiFi/BT</text>
  
  <!-- Authentication -->
  <rect x="450" y="330" width="200" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
  <text x="550" y="355" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Authentication</text>
  <text x="550" y="375" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">API Keys, Auth Mechanisms</text>
  
  <!-- Data Processing & Storage Layer -->
  <rect x="50" y="430" width="900" height="120" rx="10" ry="10" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="500" y="455" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Data Processing & Storage Layer</text>
  
  <!-- Cloud Services -->
  <rect x="100" y="480" width="200" height="60" rx="5" ry="5" fill="#ffffff" stroke="#dc3545" stroke-width="2"/>
  <text x="200" y="505" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Cloud Services</text>
  <text x="200" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">AWS IoT, Firebase</text>
  
  <!-- IoT Platforms -->
  <rect x="350" y="480" width="200" height="60" rx="5" ry="5" fill="#ffffff" stroke="#dc3545" stroke-width="2"/>
  <text x="450" y="505" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">IoT Platforms</text>
  <text x="450" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">ThingSpeak, Adafruit IO</text>
  
  <!-- Database -->
  <rect x="600" y="480" width="200" height="60" rx="5" ry="5" fill="#ffffff" stroke="#dc3545" stroke-width="2"/>
  <text x="700" y="505" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Database</text>
  <text x="700" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">SQL/NoSQL, Excel Export</text>
  
  <!-- Visualization & User Interface Layer -->
  <rect x="50" y="580" width="900" height="120" rx="10" ry="10" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="500" y="605" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Visualization & User Interface Layer</text>
  
  <!-- Mobile Application -->
  <rect x="100" y="630" width="200" height="60" rx="5" ry="5" fill="#ffffff" stroke="#ffc107" stroke-width="2"/>
  <text x="200" y="655" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Mobile Application</text>
  <text x="200" y="675" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Android Studio, Blynk App</text>
  
  <!-- Web Dashboard -->
  <rect x="350" y="630" width="200" height="60" rx="5" ry="5" fill="#ffffff" stroke="#ffc107" stroke-width="2"/>
  <text x="450" y="655" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Web Dashboard</text>
  <text x="450" y="675" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Grafana, Custom Web Interface</text>
  
  <!-- Data Analysis -->
  <rect x="600" y="630" width="200" height="60" rx="5" ry="5" fill="#ffffff" stroke="#ffc107" stroke-width="2"/>
  <text x="700" y="655" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Data Analysis</text>
  <text x="700" y="675" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">MATLAB, Python</text>
  
  <!-- Development & Maintenance Layer -->
  <rect x="50" y="730" width="900" height="40" rx="10" ry="10" fill="#e2e3e5" stroke="#6c757d" stroke-width="2"/>
  <text x="500" y="755" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Development & Maintenance (VS Code, Arduino IDE, PlatformIO, GitHub, Eclipse IDE)</text>
  
  <!-- Connection lines -->
  <!-- Hardware to Connectivity -->
  <line x1="200" y1="230" x2="200" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="230" x2="450" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="700" y1="230" x2="700" y2="330" stroke="#333" stroke-width="2"/>
  
  <!-- Connectivity to Data Processing -->
  <line x1="250" y1="390" x2="250" y2="480" stroke="#333" stroke-width="2"/>
  <line x1="550" y1="390" x2="550" y2="480" stroke="#333" stroke-width="2"/>
  
  <!-- Data Processing to Visualization -->
  <line x1="200" y1="540" x2="200" y2="630" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="540" x2="450" y2="630" stroke="#333" stroke-width="2"/>
  <line x1="700" y1="540" x2="700" y2="630" stroke="#333" stroke-width="2"/>
  
  <!-- Visualization to Development -->
  <line x1="200" y1="690" x2="200" y2="730" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="690" x2="450" y2="730" stroke="#333" stroke-width="2"/>
  <line x1="700" y1="690" x2="700" y2="730" stroke="#333" stroke-width="2"/>
</svg>